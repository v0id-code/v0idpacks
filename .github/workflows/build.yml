name: Build and verify Minecraft versions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build mod and test core
        run: bash gradlew release -PmcVersion=${{ matrix.minecraft }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: v0idpacks-${{ matrix.minecraft }}
          path: artifacts/**/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report-${{ matrix.minecraft }}
          path: core/build/reports/tests/
